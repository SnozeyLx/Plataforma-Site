name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PK }}
          SOURCE: "./"
          REMOTE_HOST: "ec2-3-150-150-223.us-east-2.compute.amazonaws.com"
          REMOTE_USER: "ubuntu"
          TARGET: "/var/www/html"
          EXCLUDE: "/.git/, /dist/, /.env, /vendor/, /node_modules/"
          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            cd /var/www/html
            sudo su
            source /root/.nvm/nvm.sh
            npm i
            npm run build
